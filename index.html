<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMA Hotel | Room Service</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div id="loader">

    <div class="loader-content">

        <img src="assets/logo.png" alt="SIMA Hotel Logo">

        <h2>SIMA HOTEL</h2>

        <p>Loading...</p>

        <div class="loading-bar">
            <span></span>
        </div>

    </div>

</div>

    <!-- HERO -->
    <header class="hero">

        <div class="overlay"></div>

        <img src="assets/hero.jpg" class="hero-bg">

        <div class="hero-content">

            <img src="assets/logo.png" class="logo" alt="Logo">

            <h1>Room Service Menu</h1>

            <p>
                Experience exceptional dining from the comfort of your room.
            </p>

            <div class="buttons">

                <a href="#menu" class="btn primary">
                    <i class="fa-solid fa-utensils"></i>
                    View Menu
                </a>

                <a href="assets/Room-Service-Menu.pdf"
                    target="_blank"
                    class="btn secondary">

                    <i class="fa-solid fa-file-pdf"></i>

                    Download PDF

                </a>

            </div>

            <div class="contact">

                <p>Need Assistance?</p>

                <a href="tel:+6281228438040">

                    <i class="fa-solid fa-phone"></i>

                    +62 812-2843-8040

                </a>

            </div>

            <div class="scroll-down">

                <i class="fa-solid fa-chevron-down"></i>

            </div>

        </div>

    </header>

    <!-- MENU -->

<section class="gallery" id="menu">

    <h2>Our Digital Menu</h2>

    <p class="page-info">
        Swipe to view our menu
    </p>

    <div class="swiper menuSwiper">

        <div class="swiper-wrapper">

            <div class="swiper-slide">
                <img src="assets/cover.jpg" alt="Cover Menu">
            </div>

            <div class="swiper-slide">
                <img src="assets/menu1.jpg" alt="Menu 1">
            </div>

            <div class="swiper-slide">
                <img src="assets/menu2.jpg" alt="Menu 2">
            </div>

            <div class="swiper-slide">
                <img src="assets/menu3.jpg" alt="Menu 3">
            </div>

        </div>

        <div class="swiper-button-next"></div>

        <div class="swiper-button-prev"></div>

        <div class="swiper-pagination"></div>

    </div>

</section>

    <!-- FLOATING BUTTON -->

    <a href="https://wa.me/6281228438040"
        class="whatsapp"
        target="_blank">

        <i class="fa-brands fa-whatsapp"></i>

    </a>

    <!-- BACK TO TOP -->

    <button id="topBtn">

        <i class="fa-solid fa-arrow-up"></i>

    </button>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="script.js"></script>

</body>

</html>
